interface:
  display_name: "Очередь задач Git-ветки"
  short_description: "Допускает задачи и атомарно передаёт локальный коммит"
  default_prompt: "Используй $fum-ocheredj-zadach-git-vetki, чтобы зарегистрировать корневую задачу, дождаться её FIFO-позиции и атомарно передать очередь локальным коммитом либо чисто завершить no-op-задачу. В обычном протоколе master не вызывай push или publish: ручной push пользователя остаётся отдельным подтверждением публикации."
