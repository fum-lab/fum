model = "gpt-5.6-sol"
model_reasoning_effort = "ultra"
service_tier = "fast"

[features]
fast_mode = true
hooks = true

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = '''python3 -c '
import contextlib
import io
import json
import subprocess

message = "Не удалось загрузить закоммиченную версию веточного барьера; автоматический допуск не подтверждён."
denial = {"decision": "block", "reason": message, "systemMessage": message}
output = io.StringIO()
try:
    result = subprocess.run(
        ["git", "show", "HEAD:Инструменты/fum-branch-task-gate/scripts/branch-task-gate.py"],
        capture_output=True,
        stdin=subprocess.DEVNULL,
        timeout=20,
    )
    if result.returncode != 0:
        raise RuntimeError(message)
    completed = False
    with contextlib.redirect_stdout(output):
        try:
            exec(compile(result.stdout, "<fum-branch-task-gate@HEAD>", "exec"), {"__name__": "__main__"})
        except SystemExit as error:
            if error.code not in (0, None):
                raise RuntimeError(message) from error
            completed = True
    if not completed:
        raise RuntimeError(message)
    print(output.getvalue(), end="")
except BaseException:
    print(json.dumps(denial, ensure_ascii=False))
' hook --expected-event UserPromptSubmit --wait-timeout-seconds 85800'''
timeout = 86400
statusMessage = "Ожидание завершения предыдущей задачи этой Git-ветки"
