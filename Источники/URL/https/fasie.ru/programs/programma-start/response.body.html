<!DOCTYPE html><html lang=en><head><meta charset="utf-8" /><meta name=viewport content="width=device-width, initial-scale=1" /><style>:root{--h1-font-size:34px;--primary-font-size:16px;--primary-color:#123a60}*,:after,:before{box-sizing:border-box}body{align-items:center;background-color:#fff;color:var(--primary-color);display:flex;font-family:Arial,Helvetica,sans-serif;font-size:var(--primary-font-size);justify-content:center;line-height:1.6;margin:0;min-height:100vh}.main-container{display:flex;flex-direction:column;max-width:992px;padding:32px 44px}.logo{margin:0 auto 80px;max-height:200px;max-width:200px}.text-h1{font-size:var(--h1-font-size);font-weight:700;line-height:1.4}.text-align-center{text-align:center}.explanation{margin-top:32px}a{color:var(--primary-color);text-decoration:none;transition:all .3s;&:hover{color:var(--primary-color);text-decoration:underline}}.contacts{flex-direction:row;gap:40px;justify-content:center;margin-top:64px;min-height:25px}.contacts,.info{align-items:center;display:flex}.info{flex-direction:column;gap:10px;margin-top:20px}.info-item{border:1px solid var(--primary-color);column-gap:6px;display:flex;flex-wrap:wrap;padding:10px 20px}.info-value{align-items:center;display:flex;flex-wrap:nowrap;font-weight:700;gap:6px}.icon-button{align-items:center;background:none;border:none;color:inherit;cursor:pointer;display:flex;outline:none;padding:0;transition:all .3s;&:hover{color:color-mix(in srgb,var(--primary-color) 75%,transparent)}&:active{color:color-mix(in srgb,var(--primary-color) 85%,transparent)}}@media screen and (max-width:576px){:root{--h1-font-size:24px;--primary-font-size:14px}.main-container{padding:32px}.contacts{flex-direction:column;gap:0}}</style></head><body><div class=main-container><div class="text-h1 text-align-center">Доступ к сайту временно ограничен владельцем веб-ресурса.</div><div class="text-align-center explanation">Если вы считаете, что произошла ошибка, свяжитесь с владельцем веб-ресурса.</div><div class=contacts></div><div class=info><div class=info-item>Ваш IP-адрес:<div class=info-value><div id=q>[REDACTED: request address]</div><button class=icon-button type=button onclick="copy(\'q\')"><svg width=10 height=12 viewBox="0 0 10 13" fill=currentColor xmlns="http://www.w3.org/2000/svg"><path id=e d="M8.5 11H3V4h5.5v7zm0-8H3a1 1 0 00-.7.3A1 1 0 002 4v7c0 .3 0 .5.3.7.2.2.4.3.7.3h5.5c.3 0 .5-.1.7-.3.2-.2.3-.4.3-.7V4a1 1 0 00-.3-.7 1 1 0 00-.7-.3zM7 1H1a1 1 0 00-.7.3A1 1 0 000 2v7h1V2h6V1z"/></svg></button></div></div><div class=info-item>Ваш ID запроса к ресурсу:<div class=info-value><div id=w>[REDACTED]</div><button class=icon-button type=button onclick="copy(\'w\')"><svg width=10 height=12 viewBox="0 0 10 13" fill=currentColor xmlns="http://www.w3.org/2000/svg"><use xlink:href=#e /></svg></button></div></div></div></div><script>function copy(a){window.getSelection().selectAllChildren(document.getElementById(a));document.execCommand("copy")};</script></body></html>
