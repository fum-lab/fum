\":2517},\"Ulrich Finsterwalder\",\"https://www.db-bauzeitung.de/wp-content/uploads/4/9/491203.jpg\",\"db deutsche bauzeitung\",0.5242494226327945,0.34714003944773175,433,507,{\"_290\":316,\"_291\":2524,\"_293\":216},{\"_290\":316,\"_291\":2524,\"_293\":294},{\"_290\":316,\"_291\":2524,\"_293\":316},{\"_290\":316,\"_291\":2524,\"_293\":360},\"image\",[668],[2527],\"iturn549681image1turn549681image4turn549681image0turn549681image5\\n\\nДа. **Самозаглубляющееся здание можно рассматривать как бетонный корабль, поставленный вертикально и уходящий не в воду, а в грунт.**\\n\\nБетонные суда — не парадокс. Плавает не сам материал, а вся герметичная оболочка вместе с заключённым в ней воздухом:\\n\\n\\\\[\\nm_{\\\\text{судна}} \u003c \\\\rho_{\\\\text{воды}}V_{\\\\text{вытесненной воды}}.\\n\\\\]\\n\\nТочно так же стальной корабль плавает, хотя сталь значительно тяжелее воды. Исторические бетонные суда представляли собой полые железобетонные оболочки, армированные стержнями и сетками. В США бетонные суда и баржи серийно строили во время мировых войн из-за дефицита судовой стали. Технически они оказались работоспособными, но проигрывали стальным судам по массе, скорости и экономике. citeturn580992search0turn580992search7\\n\\n## Подземное здание как корабль наоборот\\n\\n| Корабль | Самозаглубляющееся здание |\\n|---|---|\\n| Корпус удерживает воду снаружи | Оболочка удерживает грунт и воду снаружи |\\n| Палубы усиливают корпус | Перекрытия служат горизонтальными диафрагмами |\\n| Шпангоуты и переборки | Кольцевые стены и радиальные перегородки |\\n| Киль | Режущее нижнее кольцо |\\n| Балластные цистерны | Камеры управляемого заглубления |\\n| Трюм | Нижний технический этаж |\\n| Машинное отделение | Проходческая и насосная камера |\\n| Сухой док | Наземная площадка бетонирования |\\n| Балластирование | Управление массой, креном и скоростью опускания |\\n\\nПолучается уже не фундамент под зданием. **Всё здание является корпусом.**\\n\\nНаиболее точная аналогия — не надводный корабль, а сочетание:\\n\\n- железобетонной подводной лодки;\\n- опускного колодца;\\n- плавучего кессона;\\n- растущего корня.\\n\\n## Такая технология частично уже существует\\n\\nКрупные железобетонные кессоны и секции погружных тоннелей изготавливают в сухих условиях, герметизируют, спускают на воду, буксируют к месту строительства и погружают заполнением балластных камер. Именно так строились некоторые подводные тоннели; инженерные руководства USACE также описывают бетонные конструкции, которые доставляют на плаву и затем опускают на подготовленное основание. citeturn408621search1turn408621search4turn408621search6turn408621search9\\n\\nИз этого можно вывести технологию **вертикального геокорабля**:\\n\\n1. На поверхности строится герметичный нижний модуль.\\n2. По периметру располагаются независимые балластные камеры.\\n3. Под режущим кольцом выбирается грунт.\\n4. Заполнением отдельных камер водой или тяжёлой суспензией регулируются вес и крен.\\n5. Корпус опускается на высоту очередного этажа.\\n6. Сверху наращивается следующий герметичный пояс.\\n7. Цикл повторяется.\\n8. После достижения глубины устраиваются постоянное днище, анкеры и эксплуатационные этажи.\\n\\nВажно: **через ненарушенный грунт корпус одним балластом не пройдёт**. В воде бетонный корабль свободно перемещается, а в грунте возникают сопротивление под ножом, боковое трение, валуны и заклинивание. Поэтому балласт не заменяет разработку грунта — он превращается в точный исполнительный механизм управления заглублением.\\n\\n## Балласт может заменить часть домкратной системы\\n\\nНапример, корпус разделён по окружности на восемь вертикальных камер:\\n\\n```text\\n              поверхность\\n        ┌──────────────────┐\\n        │   новый этаж     │\\n        ├───┬───┬───┬──────┤\\n        │ Б │   помещения  │ Б\\n        │ А │              │ А\\n        │ Л │ центральная  │ Л\\n        │ Л │    шахта     │ Л\\n        │ А │              │ А\\n        │ С │              │ С\\n        │ Т │              │ Т\\n        └───────╲────╱──────┘\\n                 нож\\n             удаление грунта\\n```\\n\\nЕсли сооружение начинает наклоняться вправо:\\n\\n- правые камеры частично разгружаются;\\n- левые камеры заполняются;\\n- грунт под правой частью ножа выбирается осторожнее;\\n- гидравлические домкраты выполняют окончательную коррекцию.\\n\\nТо есть эффективна **гибридная система: балласт плюс домкраты плюс управляемая выемка грунта**.\\n\\n## Фибробетон здесь особенно логичен\\n\\nИсторический **ферроцемент** и современный **фибробетон** — родственные, но не одинаковые технологии:\\n\\n- в ферроцементе пространственный каркас образуют стержни и несколько слоёв металлической сетки;\\n- в фибробетоне короткие волокна распределены непосредственно по всему объёму смеси;\\n- в ответственной оболочке лучше сочетать оба принципа.\\n\\nДля геокорабля рационален такой материал:\\n\\n\\\\[\\n\\\\text{водонепроницаемый бетон}\\n+\\\\text{стальная фибра}\\n+\\\\text{микрофибра}\\n+\\\\text{направленная арматура}\\n+\\\\text{кольцевое преднапряжение}.\\n\\\\]\\n\\nФибра удерживает множество мелких трещин, а стержни и напрягаемые канаты воспринимают крупные направленные усилия. Обычная арматура всё равно нужна возле ножа, шлюзов, шахт, стыков перекрытий, домкратных узлов и анкеров. Современные руководства по бетонным тоннельным оболочкам также рассматривают фибровое и комбинированное армирование как средство повышения трещиностойкости и остаточной несущей способности. citeturn408621search2\\n\\n## Главное различие с настоящим кораблём\\n\\nКорабль должен **не утонуть**. Подземный дом после строительства должен **не всплыть**.\\n\\nПри высоком уровне грунтовой воды подъёмная сила может составлять приблизительно:\\n\\n\\\\[\\nF_{\\\\text{всплытия}}=\\\\rho_{\\\\text{воды}}gV.\\n\\\\]\\n\\nКаждые 1000 м³ вытесненной грунтовой воды дают примерно **1000 тонн подъёмной силы**. Поэтому после завершения погружения нужны:\\n\\n- тяжёлое днище;\\n- постоянный твёрдый балласт;\\n- анкерные сваи;\\n- раскрывающиеся боковые «корни»;\\n- либо сочетание этих решений.\\n\\nИдея в итоге объединяется очень цельно:\\n\\n\u003e **Фибробетонный корабль-корень строится на поверхности, растёт сверху, управляемо погружается снизу, а после достижения глубины закрепляется в грунте боковыми корнями.**\\n\\nЭто уже можно называть **геокораблём**: при строительстве он ведёт себя как погружаемое судно, а в эксплуатации — как укоренившееся подземное растение.\",{\"_677\":678},{\"_200\":2066,\"_207\":2532,\"_46\":2069,\"_210\":2533,\"_212\":213,\"_214\":26,\"_215\":216,\"_217\":2534,\"_219\":220},\"43783b55-7a78-432b-b56d-bbc800b3f20b\",[2051],{\"_674\":675,\"_217\":2538},{\"_669\":692,\"_210\":2537},{\"_685\":686,\"_687\":2535,\"_240\":2079,\"_242\":2079,\"_689\":2536,\"_691\":2069,\"_259\":10,\"_252\":14},326,1786737754.108385,\"Обработка заняла 5m 26s\",{},{\"_200\":2530,\"_207\":2542,\"_46\":2069,\"_210\":2543,\"_212\":213,\"_215\":216,\"_217\":2544,\"_219\":220},\"97647f7d-c8a1-4674-af88-fd4c05c21346\",[2066],{\"_674\":675,\"_217\":2546},{\"_669\":703,\"_704\":586},{\"_240\":2079,\"_242\":2079,\"_689\":2545,\"_253\":254,\"_259\":10,\"_702\":26},1786737757.0435479,{},{\"_200\":2540,\"_207\":2550,\"_46\":2551,\"_210\":2552,\"_212\":213,\"_214\":14,\"_215\":216,\"_217\":2553,\"_219\":220},\"975da1b7-5e6b-4383-9645-32b3d764b0fe\",[2530],{\"_674\":675,\"_217\":2588},1786737920.962513,{\"_669\":834,\"_834\":2584,\"_836\":2585},{\"_713\":2554,\"_685\":715,\"_716\":717,\"_718\":2555,\"_720\":721,\"_689\":2545,\"_253\":254,\"_723\":724,\"_236\":2078,\"_238\":239,\"_240\":2079,\"_242\":2079,\"_243\":244,\"_245\":246,\"_247\":248,\"_235\":59,\"_249\":59,\"_58\":59,\"_250\":251,\"_252\":14,\"_259\":10},{\"_228\":2558,\"_728\":2559},[2556,2557],\"https://www.google.com/s2/favicons?domain=www.history.navy.mil\u0026sz=128\",\"https://www.google.com/s2/favicons?domain=www.concreteships.org\u0026sz=128\",[2565,2566],[2560,2561,2562,2563,2564,2548],\"8d513 3124,\"_212\":607,\"_608\":-5,\"_609\":-5},{\"_576\":3095,\"_578\":-5,\"_579\":3107,\"_581\":3108,\"_54\":3109,\"_584\":3110,\"_39\":3100,\"_587\":-5,\"_42\":602,\"_603\":3111,\"_605\":3112,\"_212\":607,\"_608\":-5,\"_609\":-5},{\"_576\":3095,\"_578\":-5,\"_579\":3096,\"_581\":3097,\"_54\":3098,\"_584\":3099,\"_39\":3100,\"_587\":-5,\"_42\":602,\"_603\":3101,\"_605\":3102,\"_212\":607,\"_608\":-5,\"_609\":-5},{\"_576\":577,\"_578\":-5,\"_579\":3085,\"_581\":3086,\"_54\":3087,\"_584\":3088,\"_39\":586,\"_587\":-5,\"_42\":588,\"_589\":3089,\"_591\":14},5937,5938,[],[],[3090,3091],{\"_45\":3094,\"_33\":1624,\"_289\":2403},{\"_45\":3092,\"_33\":2877,\"_289\":3093},\"СП 360.1325800.2017 Конструкции сталефибробетонные ...\",\"Документы ЦНТД\",\"Precast Concrete Segmental Liners for Large Diameter Road Tunnels - Literature Survey and Synthesis\",\"citeturn688356view2\",5097,5119,[1624],[],\"([fhwa.dot.gov](https://www.fhwa.dot.gov/bridge/tunnel/pubs/hif20035.pdf))\",[3103],[],{\"_45\":3094,\"_33\":1624,\"_289\":2403,\"_288\":-5,\"_284\":-5,\"_612\":-5,\"_613\":3104,\"_584\":3105,\"_616\":-5,\"_617\":-5},[],[3106],{\"_290\":299,\"_291\":620,\"_293\":299},2502,2524,[1624],[],[3113],[],{\"_45\":3094,\"_33\":1624,\"_289\":2403,\"_288\":-5,\"_284\":-5,\"_612\":-5,\"_613\":3114,\"_584\":3115,\"_616\":-5,\"_617\":-5},[],[3116],{\"_290\":299,\"_291\":620,\"_293\":299},\"citeturn354410search5turn354410search26\",2057,2100,[2874,2875,2876,2877],[],\"([Документы ЦНТД](https://docs.cntd.ru/document/550566433?utm_source=chatgpt.com))\",[3125],[],{\"_45\":3092,\"_33\":2877,\"_289\":3093,\"_288\":-5,\"_284\":2932,\"_612\":-5,\"_613\":3126,\"_584\":3127,\"_616\":-5,\"_617\":-5},[3130],[3128,3129],{\"_290\":216,\"_291\":292,\"_293\":360},{\"_290\":216,\"_291\":292,\"_293\":322},{\"_45\":2910,\"_33\":2875,\"_288\":-5,\"_284\":2911,\"_289\":3093},\"citeturn688356view2turn688356view3\",1077,1115,[2873,1624],[],[3138],[],{\"_45\":3094,\"_33\":1624,\"_289\":2403,\"_288\":-5,\"_284\":-5,\"_612\":-5,\"_613\":3139,\"_584\":3140,\"_616\":-5,\"_617\":-5},[3143],[3141,3142],{\"_290\":299,\"_291\":620,\"_293\":299},{\"_290\":299,\"_291\":620,\"_293\":566},{\"_45\":3144,\"_33\":2873,\"_288\":-5,\"_284\":-5,\"_347\":3145,\"_289\":3146},\"Guideline For Good Practice Of Fibre Reinforced Precast Segment - Vol. 2 : Production Aspects\",\"https://images.openai.com/static-rsc-1/1RYxHFyximB1s3fSeHkt7OETY4wbi7r7xTfgd8l1gac39KLv6yOQmVn2UPTsOxEwuwQbgvu2AoObT8yDSt17CJMb7DxgZw5mDIcBdvNBxOl4F7SDkiaAq4NCmitpgNtweSA3XfHVetmdls6yGkYL2Q\",\"about.ita-aites.org\",[668],[3149],\"**Именно фибробетон здесь особенно уместен.** Он делает конструкцию похожей на растение уже не только геометрически, но и по внутреннему устройству: бетонная матрица играет роль ткани, а распределённые волокна — роль волокнистого каркаса, который не даёт локальной трещине сразу превратиться в сквозной разрыв.\\n\\nДля самозаглубляющегося подземного сооружения фибра особенно полезна из-за нескольких нагрузок, возникающих одновременно:\\n\\n- оболочку неравномерно сжимает грунт;\\n- при опускании возникают перекосы и локальные опирания;\\n- режущая часть испытывает удары и истирание;\\n- вокруг проёмов и стыков концентрируются напряжения;\\n- необходимо ограничивать ширину трещин из-за грунтовой воды.\\n\\nСтальная фибра повышает остаточную несущую способность бетона после образования трещины и распределяет повреждения по множеству мелких трещин вместо одной крупной. Именно поэтому фибробетон уже применяется в тоннельных сегментах и других подземных оболочках. Международные руководства рассматривают как чисто фибровое, так и гибридное армирование — фибра вместе с обычной арматурой. citeturn688356view2turn688356view3\\n\\n## Но лучше не чистый фибробетон, а гибрид\\n\\nДля такого здания я бы выбрал:\\n\\n\\\\[\\n\\\\text{железобетон}+\\\\text{стальная фибра}+\\\\text{полипропиленовая микрофибра}.\\n\\\\]\\n\\n### Стальная фибра\\n\\nРаботает как конструкционное распределённое армирование:\\n\\n- удерживает раскрывающиеся трещины;\\n- повышает вязкость разрушения;\\n- помогает оболочке переживать местные перегрузки;\\n- увеличивает стойкость к ударам и сколам;\\n- позволяет уменьшить количество мелкой распределительной арматуры.\\n\\nВ России расчёт сталефибробетонных конструкций регулируется СП 360.1325800.2017 с Изменением № 1. Документ допускает как сталефибробетонные, так и комбинированно армированные конструкции. Однако область его прямого применения ограничена, в частности, статическими нагрузками и неагрессивной средой, поэтому для погружающейся водонепроницаемой оболочки потребуются отдельное обоснование переходных стадий, анализ грунтовой воды и, вероятно, натурные испытания элементов. citeturn354410search5turn354410search26\\n\\n### Полипропиленовая микрофибра\\n\\nОна выполняет другую задачу:\\n\\n- уменьшает пластическую усадку свежего бетона;\\n- снижает риск ранних поверхностных трещин;\\n- при пожаре создаёт микроканалы для выхода пара и уменьшает вероятность взрывного откалывания бетона.\\n\\nПолипропиленовую микрофибру в тоннельных облицовках применяют именно как элемент противопожарной защиты, а не как основную силовую арматуру. citeturn688356view2\\n\\n## Где обычная арматура всё равно необходима\\n\\nФибра хорошо воспринимает **распределённые растягивающие напряжения**, но гораздо хуже заменяет стержни там, где усилие должно передаваться направленно.\\n\\nПоэтому обычные арматурные каркасы нужны:\\n\\n- в режущем нижнем кольце;\\n- вокруг дверных, лифтовых и технологических проёмов;\\n- в местах крепления домкратов;\\n- в соединениях перекрытий с наружной оболочкой;\\n- в верхнем опорном кольце;\\n- в днище, особенно при проверке на всплытие;\\n- в зонах, где возникает большой изгибающий момент;\\n- в местах возможного локального контакта с валунами или твёрдой прослойкой.\\n\\nТо есть оболочка могла бы выглядеть так:\\n\\n```text\\n        наружная поверхность\\n               │\\n     ┌────────────────────┐\\n     │  • — •  · • — ·   │\\n     │ · стальная фибра · │\\n     │  • · — • · • —    │  монолитная\\n     │                    │  водонепроницаемая\\n     │  ○            ○    │  оболочка\\n     │ обычные стержни    │\\n     └────────────────────┘\\n               │\\n        внутренняя поверхность\\n```\\n\\nФибра распределена по всему объёму, а стержни проходят только по силовым траекториям — подобно тому, как у растения есть одновременно мелкая волокнистая ткань и крупные проводящие пучки.\\n\\n## Наиболее «растительная» конструкция\\n\\nМожно сделать оболочку неоднородной:\\n\\n1. **Наружный плотный слой** — водонепроницаемый сталефибробетон.\\n2. **Средний силовой слой** — фибробетон с кольцевыми и вертикальными арматурными пучками.\\n3. **Внутренний ремонтный слой** — мелкозернистый фибробетон или фиброторкрет.\\n4. Между наружной и внутренней оболочками — контролируемый дренажный зазор.\\n\\nТогда наружная стенка напоминает кору, силовые стержни — сосудистые пучки, распределённая фибра — волокнистую ткань, а внутренний слой — постоянно доступную для ремонта живую поверхность.\\n\\n## Как строить\\n\\nДля самозаглубления особенно подходит циклическое бетонирование кольцами:\\n\\n```text\\n1. На поверхности устанавливается кольцевая опалубка.\\n2. Бетонируется новый пояс сталефибробетона.\\n3. Он набирает необходимую раннюю прочность.\\n4. Сооружение управляемо опускается.\\n5. Сверху бетонируется следующий пояс.\\n6. Цикл повторяется.\\n```\\n\\nФибра здесь удобна тем, что кольцо получает трещиностойкость во всех направлениях без чрезвычайно густого пространственного каркаса. Но состав смеси нельзя задавать просто количеством килограммов фибры на кубометр: проектным параметром должна быть **остаточная прочность после раскрытия трещины**, подтверждённая испытанием контрольных балок. Такой подход используется и в современных руководствах по фибробетонным тоннельным сегментам. citeturn688356view2\\n\\n## Оптимальная формула конструкции\\n\\nДля первой реалистичной версии:\\n\\n- круглая монолитная оболочка;\\n- водонепроницаемый тяжёлый бетон;\\n- конструкционная стальная фибра;\\n- полипропиленовая микрофибра;\\n- кольцевая и вертикальная стержневая арматура только в расчётных силовых зонах;\\n- мощное железобетонно-стальное режущее кольцо;\\n- перекрытия-диафрагмы на каждом этаже;\\n- управляемое опускание домкратами;\\n- внутренняя ремонтопригодная облицовка.\\n\\nПолучается буквально **железобетонный корень с волокнистой тканью**. Причём фибробетон здесь не декоративная аналогия, а материал, который помогает сооружению переносить именно тот режим работы, который характерен для растущего корня: множество малых локальных деформаций, контакт с неоднородной средой и необходимость сохранять целостность при постепенном продвижении.\",{\"_677\":678},{\"_200\":2854,\"_207\":3154,\"_46\":2857,\"_210\":3155,\"_212\":213,\"_214\":26,\"_215\":216,\"_217\":3156,\"_219\":220},\"c8ce69fa-b83e-4f03-b1df-b339e281b47e\",[2840],{\"_674\":675,\"_217\":3160},{\"_669\":692,\"_210\":3159},{\"_685\":686,\"_687\":3157,\"_240\":2867,\"_242\":2867,\"_689\":3158,\"_691\":2857,\"_259\":10,\"_252\":14},283,1786736228.920258,\"Обработка заняла 4m 43s\",{},{\"_200\":3152,\"_207\":3164,\"_46\":2857,\"_210\":3165,\"_212\":213,\"_215\":216,\"_217\":3166,\"_219\":220},\"39198824-9279-43e0-a420-1e17a98ee0b6\",[2854],{\"_674\":675,\"_217\":3168},{\"_669\":703,\"_704\":586},{\"_240\":2867,\"_242\":2867,\"_689\":3167,\"_253\":254,\"_259\":10,\"_702\":26},1786736231.7995713,{},{\"_200\":3162,\"_207\":3172,\"_46\":3173,\"_210\":3174,\"_212\":213,\"_214\":14,\"_215\":216,\"_217\":3175,\"_219\":220},\"9e8a39f9-7d99-48c1-8c66-0f5f04a8ded5\",[3152],{\"_674\":675,\"_217\":3277},1786736337.589294,{\"_669\":834,\"_834\":3272,\"_836\":3273},{\"_713\":3176,\"_685\":715,\"_716\":717,\"_718\":3177,\"_720\":721,\"_689\":3178,\"_253\":254,\"_723\":724,\"_236\":2866,\"_238\":239,\"_240\":2867,\"_242\":2867,\"_243\":244,\"_245\":246,\"_247\":248,\"_235\":59,\"_249\":59,\"_58\":59,\"_250\":251, 259\":10,\"_252\":14},[],[],[861],[910],[3538,3539,3540,3541],{\"_42\":292,\"_1056\":3545},{\"_42\":292,\"_1056\":3544},{\"_42\":292,\"_1056\":3543},{\"_42\":292,\"_1056\":3542},\"site:efnarc.org fibre reinforced concrete underground structures guideline pdf\",\"site:concrete.org fiber reinforced concrete underground structures ACI 544 official\",\"site:minstroyrf.gov.ru фибробетон СП 360.1325800\",\"site:docs.cntd.ru СП фибробетонные конструкции стальная фибра подземные сооружения\",\"{\\\"search_query\\\":[{\\\"q\\\":\\\"site:docs.cntd.ru СП фибробетонные конструкции стальная фибра подземные сооружения\\\"},{\\\"q\\\":\\\"site:minstroyrf.gov.ru фибробетон СП 360.1325800\\\"},{\\\"q\\\":\\\"site:concrete.org fiber reinforced concrete underground structures ACI 544 official\\\"},{\\\"q\\\":\\\"site:efnarc.org fibre reinforced concrete underground structures guideline pdf\\\"}],\\\"response_length\\\":\\\"long\\\"}\",{},{\"_200\":3527,\"_207\":3551,\"_46\":3158,\"_210\":3552,\"_212\":213,\"_215\":316,\"_217\":3553,\"_219\":220},\"b28ca3ea-5529-4765-a884-b623489b13b8\",[3184],{\"_674\":1017,\"_1018\":1104,\"_217\":3558},{\"_669\":670,\"_671\":3557},{\"_1091\":3159,\"_1092\":1093,\"_1094\":586,\"_257\":2869,\"_864\":3549,\"_243\":244,\"_245\":246,\"_247\":248,\"_1095\":26,\"_941\":3554,\"_240\":2867,\"_242\":2867,\"_249\":59,\"_857\":299,\"_720\":721,\"_689\":3158,\"_253\":254,\"_236\":3555,\"_238\":239,\"_58\":59,\"_250\":251,\"_687\":3157,\"_1098\":14,\"_1099\":1100,\"_1101\":26,\"_259\":10,\"_252\":14},[3556],\"[REDACTED: local request metadata]\",{\"_42\":944,\"_212\":945,\"_946\":947,\"_948\":949,\"_950\":294},[586],{},{\"_200\":3549,\"_207\":3562,\"_46\":3563,\"_48\":3564,\"_210\":3565,\"_212\":213,\"_215\":216,\"_217\":3566,\"_219\":220},\"8a7c39da-fdf9-4e59-bacc-b17a12f6eeec\",[3527],{\"_674\":1123,\"_217\":3572},1786736214.457,1786736231.187604,{\"_669\":670,\"_671\":3570},{\"_1114\":3567,\"_1116\":3568,\"_236\":3555,\"_1118\":-5,\"_240\":2867,\"_242\":2867,\"_235\":59,\"_259\":10,\"_252\":14},[],{\"_1119\":3569},[],[3571],\"Fibrobeton\",{},{\"_200\":3560,\"_207\":3576,\"_46\":3577,\"_210\":3578,\"_212\":213,\"_214\":26,\"_215\":216,\"_217\":3579,\"_219\":220,\"_221\":222},\"897881dd-9e4e-5efd-9909-cc81b62c39cf\",[3549],{\"_674\":675,\"_217\":3595},1786703892.832042,{\"_669\":670,\"_671\":3593},{\"_223\":3580,\"_225\":26,\"_233\":3581,\"_226\":3582,\"_231\":3583,\"_235\":59,\"_228\":3584,\"_236\":3585,\"_238\":239,\"_240\":3586,\"_242\":3586,\"_243\":244,\"_245\":246,\"_247\":248,\"_249\":59,\"_58\":59,\"_250\":251,\"_252\":26,\"_253\":254,\"_255\":3587,\"_257\":3588,\"_1142\":3589,\"_259\":10},{\"_42\":665,\"_666\":3592},[],[],[],[],\"[REDACTED: local request metadata]\",\"[REDACTED: local request metadata]\",{\"_260\":261},\"[REDACTED: local request metadata]\",{\"_1144\":3590,\"_1146\":1147,\"_1148\":-5,\"_1149\":3591},\"[REDACTED: local request metadata]\",\"2026-08-14T10:38:21.340162+00:00\",[668],[3594],\"Да — причём **не просто на растение, а именно на растущий корень**.\\n\\nСоответствия почти прямые:\\n\\n- **режущий нож снизу** — корневой чехлик, раздвигающий среду;\\n- **рабочая камера** — зона роста;\\n- **наращиваемые этажи** — новые клетки корня;\\n- **наружная железобетонная оболочка** — кора;\\n- **центральная шахта с коммуникациями** — сосудистый пучок;\\n- **боковые анкеры и микросваи** — боковые корни;\\n- **датчики давления, воды и крена** — аналог чувствительности корня к препятствиям, влаге и направлению тяжести.\\n\\nМожно сделать концепцию ещё более «растительной»: сооружение не просто опускается целиком, а **постепенно прорастает в грунт**. Внизу работает автономная головка, которая рыхлит и удаляет грунт, а наверху или непосредственно за головкой непрерывно формируется новая оболочка. Тогда нижняя часть действительно напоминает апикальную меристему корня — активную область роста.\\n\\nПри этом здание может расти сразу в двух направлениях:\\n\\n```text\\n             к свету\\n                ↑\\n          наземный стебель\\n               ║\\n──────────── поверхность ────────────\\n               ║\\n          подземные этажи\\n               ║\\n        технические «ткани»\\n               ║\\n          зона роста корня\\n              \\\\↓/\\n          разрушение грунта\\n```\\n\\nИз этой аналогии можно вывести полноценную архитектуру:\\n\\n**«Стебель»** — наземная часть, вход, световой фонарь, вентиляция, солнечная энергетика.\\n\\n**«Корень»** — жилые, технические, складские и защищённые этажи.\\n\\n**«Сосудистая система»** — центральный вертикальный канал для лифта, воздуха, воды, электричества, данных и удаления грунта во время строительства.\\n\\n**«Боковые корни»** — горизонтальные помещения, геотермальные контуры, резервуары, дренажи и анкеры, которые раскрываются на нужной глубине.\\n\\n**«Листья»** — наземные солнечные панели, радиаторы охлаждения, теплицы или светоулавливающие зеркала.\\n\\nСамая интересная версия — не единичный цилиндр, а **подземное дерево**: один вертикальный ствол-шахта и расходящиеся на разных глубинах горизонтальные «корни»-галереи. Центральный ствол сначала самозаглубляется, а затем из него запускаются небольшие проходческие головки, формирующие боковые помещения.\\n\\nТакое сооружение могло бы не иметь окончательной формы. Оно росло бы по потребности:\\n\\n- понадобилось больше жилья — появился новый подземный «узел»;\\n- нужен склад — вырос боковой корень;\\n- обнаружена вода — ветвь направилась к водоносному слою;\\n- встретилась скала — рост изменил направление;\\n- потребовалась устойчивость — раскрылись дополнительные анкерные корни.\\n\\nТо есть это уже не совсем фундамент. Это **архитектурный организм, который осваивает грунт примерно так же, как растение осваивает почву**. Хорошее название для принципа — **геотропная архитектура** или **дом-корень**.\",{},{\"_200\":3574,\"_207\":3599,\"_46\":3577,\"_210\":3600,\"_212\":213,\"_214\":26,\"_215\":216,\"_217\":3601,\"_219\":220},\"aeb591e5-9fe8-4d91-aab1-ccc6779c9e 3\":3669,\"_289\":4130,\"_288\":-5,\"_284\":-5,\"_612\":-5,\"_613\":4153,\"_584\":4154,\"_616\":-5,\"_617\":-5},[],[4155],{\"_290\":294,\"_291\":620,\"_293\":216},5150,5172,[3669],[],[4162],[],{\"_45\":4129,\"_33\":3669,\"_289\":4130,\"_288\":-5,\"_284\":-5,\"_612\":-5,\"_613\":4163,\"_584\":4164,\"_616\":-5,\"_617\":-5},[],[4165],{\"_290\":294,\"_291\":620,\"_293\":216},\"citeturn351498search2\",3926,3950,[3661,3662],[],\"([Документы ЦНТД](https://docs.cntd.ru/document/1200092709/titles/7EO0KL?utm_source=chatgpt.com))\",[4174],[],{\"_45\":4128,\"_33\":3662,\"_289\":3093,\"_288\":-5,\"_284\":4175,\"_612\":-5,\"_613\":4176,\"_584\":4177,\"_616\":-5,\"_617\":-5},\"5.4.2 В плане опускные колодцы должны иметь форму круга или вписанного в него многоугольника. Монолитные колодцы допускается проектировать прямоугольной формы.\",[],[4178],{\"_290\":216,\"_291\":292,\"_293\":299},\"citeturn559553view3turn559553view4\",3523,3561,[3669],[],[4186],[],{\"_45\":4129,\"_33\":3669,\"_289\":4130,\"_288\":-5,\"_284\":-5,\"_612\":-5,\"_613\":4187,\"_584\":4188,\"_616\":-5,\"_617\":-5},[4191],[4189,4190],{\"_290\":294,\"_291\":620,\"_293\":566},{\"_290\":294,\"_291\":620,\"_293\":294},{\"_45\":4129,\"_33\":3669,\"_288\":-5,\"_284\":-5,\"_289\":4130},\"citeturn564081view0turn564081view3\",881,919,[3669,3670],[],[4199],[],{\"_45\":4129,\"_33\":3669,\"_289\":4130,\"_288\":-5,\"_284\":-5,\"_612\":-5,\"_613\":4200,\"_584\":4201,\"_616\":-5,\"_617\":-5},[4204],[4202,4203],{\"_290\":566,\"_291\":620,\"_293\":316},{\"_290\":566,\"_291\":620,\"_293\":566},{\"_45\":4140,\"_33\":3670,\"_288\":-5,\"_284\":-5,\"_289\":4130},\"iturn627639image2\",[3667,3668,3671,3672],[4222],\"[![Основания и фундаменты. Часть 11 | BuildCalc - расчёты в строительстве](https://images.openai.com/static-rsc-4/JGCZNoMdXAELHWl4OOLhSQaU6eGiutM-7Ls4XppVAtwZhMHyXdRXTs8xmqbh6w_odjcHkI2sKdC4pB__aXD16D9tFfWqvRr0vkAcE-cUA_2rALIfxW2mpNXopG5IYrFYnPgn_6rNpu0Qang3sDK_kQDGzknBZYb5krI_kc3-emI?purpose=inline)](https://www.buildcalc.ru/learning/basesandfoundations/Open.aspx?id=Chapter11\u0026part=2\u0026utm_source=chatgpt.com)\\n\",\"\\n## Images:\\n![Основания и фундаменты. Часть 11 | BuildCalc - расчёты в строительстве](https://images.openai.com/static-rsc-4/JGCZNoMdXAELHWl4OOLhSQaU6eGiutM-7Ls4XppVAtwZhMHyXdRXTs8xmqbh6w_odjcHkI2sKdC4pB__aXD16D9tFfWqvRr0vkAcE-cUA_2rALIfxW2mpNXopG5IYrFYnPgn_6rNpu0Qang3sDK_kQDGzknBZYb5krI_kc3-emI?purpose=inline)\\n\",[4211],{\"_33\":3672,\"_2471\":3667,\"_2472\":4212,\"_347\":3668,\"_2474\":4213,\"_2476\":4214,\"_45\":4215,\"_2479\":-5,\"_2480\":26,\"_2481\":-5,\"_2482\":4216,\"_289\":4217},{\"_35\":4220,\"_37\":4221},{\"_35\":4220,\"_37\":4221},{\"_2485\":4218,\"_2487\":4219},\"Основания и фундаменты. Часть 11 | BuildCalc - расчёты в строительстве\",\"https://www.buildcalc.ru/learning/basesandfoundations/Chapter11/Images/ris.1.gif\",\"buildcalc.ru\",0.13800424628450106,0.15789473684210525,471,418,{\"_290\":316,\"_291\":2524,\"_293\":299},[668],[4225],\"iturn627639image2\\n\\nДа. Технически это вполне реальная схема. Правильнее называть её не просто **самозаглубляющимся фундаментом**, а **многоэтажным опускным сооружением**, или **подземной башней, возводимой способом опускного колодца**.\\n\\nЖелезобетонная оболочка одновременно становится:\\n\\n- фундаментом;\\n- наружными стенами всех подземных этажей;\\n- подпорной конструкцией;\\n- защитой от грунта и подземных вод.\\n\\nОпускной колодец строят на поверхности, а затем погружают по мере удаления грунта изнутри — под собственным весом, пригрузкой либо управляемыми домкратами. В российском проектировании подземных сооружений сейчас применяется СП 248.1325800.2023, введённый в действие 10 февраля 2024 года; специальные рекомендации по опускным колодцам описывают ножевую часть, форшахту, задавливающие устройства, погружение, устройство днища и последующий монтаж внутренних конструкций. citeturn564081view0turn564081view3\\n\\n## Наиболее интересная реализация вашей идеи\\n\\nМожно сделать так, чтобы **этажи тоже постепенно уходили под землю**, а почти все бетонные работы выполнялись на уровне поверхности:\\n\\n1. На поверхности сооружается нижнее режущее кольцо — «нож».\\n2. Над ним строится первый, самый нижний этаж с большим центральным проёмом.\\n3. Через проём извлекается грунт из рабочей камеры под сооружением.\\n4. Вся конструкция управляемо опускается примерно на высоту одного этажа.\\n5. На поверхности над ней бетонируется следующий этаж.\\n6. Цикл повторяется, пока сооружение не достигнет проектной глубины.\\n7. После погружения бетонируются герметичное силовое днище и постоянные внутренние конструкции.\\n8. Центральный технологический проём превращается в лестнично-лифтовое ядро, атриум или инженерную шахту.\\n\\nУсловный разрез:\\n\\n```text\\n             уровень земли\\n──────────────────────────────────\\n  новый верхний этаж строится здесь\\n╔════════════════════════════════╗\\n║ этаж −1        ○ шахта         ║\\n╠════════════════════════════════╣\\n║ этаж −2        ○ шахта         ║\\n╠════════════════════════════════╣\\n║ этаж −3        ○ шахта         ║\\n╚════════════════════════════════╝\\n \\\\                              /\\n  \\\\       рабочая камера       /\\n   \\\\______ режущий нож _______/\\n           удаление грунта\\n```\\n\\nГлавное достоинство такой схемы — **сооружение растёт вниз, но рабочая зона всё время остаётся около поверхности**. Перекрытия одновременно служат горизонтальными диафрагмами, не позволяющими наружной оболочке деформироваться.\\n\\n## Оно не должно опускаться только под собственным весом\\n\\nБуквально «самозаглубляющаяся» конструкция плохо управляема. Требуется баланс:\\n\\n\\\\[\\nG + J \u003e F_{\\\\text{боковое}} + R_{\\\\text{под ножом}},\\n\\\\]\\n\\nгде:\\n\\n- \\\\(G\\\\) — вес сооружения;\\n- \\\\(J\\\\) — усилие домкратов;\\n- \\\\(F_{\\\\text{боковое}}\\\\) — трение стен о грунт;\\n- \\\\(R_{\\\\text{под ножом}}\\\\) — сопротивление грунта режущей части.\\n\\nПри этом запас не должен быть слишком большим, иначе возможен внезапный провал. Практически нужен **принудительно управляемый опускной колодец**:\\n\\n- несколько независимо регулируемых групп гидродомкратов по периметру;\\n- наземное направляющее кольцо — форшахта;\\n- грунтовые анкеры или сваи как реакционные опоры;\\n- тиксотропная глинистая рубашка между оболочкой и грунтом для снижения трения;\\n- непрерывное измерение крена, перемещений и усилий.\\n\\nДействующий СП требует рассматривать отдельно строительные и эксплуатационные расчётные ситуации, а геотехнический мониторинг должен начинаться с ранней стадии строительства и позволять немедленно корректировать технологию при выходе параметров за установленные пределы. citeturn559553view3turn559553view4\\n\\n## Оптимальная форма\\n\\nЛучше всего работает:\\n\\n- круг;\\n- правильный многоугольник;\\n- квадрат со скруглёнными углами.\\n\\nКруглая оболочка равномернее воспринимает давление грунта и воды, а также меньше склонна к заклиниванию. Классические нормы по опускным колодцам предпочитают круг или вписанный многоугольник, хотя монолитная прямоугольная форма также допускается. citeturn351498search2\\n\\nДля жилого здания я бы использовал **восьмигранную или круглую наружную оболочку**, а помещения внутри сформировал бы обычными прямоугольными перегородками. Тогда снаружи получается геотехнически выгодный цилиндр, а внутри — нормальная планировка.\\n\\nБольшой вытянутый прямоугольник возможен, но его приходится усиливать поперечными стенами и временными распорками; вероятность перекоса и заклинивания будет выше.\\n\\n## Главная проблема — вода и всплытие\\n\\nПодземное сооружение может вести себя как пустой корабль. Например, если расчётный уровень воды находится на 10 м выше днища, подъёмное давление составляет примерно:\\n\\n\\\\[\\n100\\\\ \\\\text{кПа} \\\\approx 10\\\\ \\\\text{тонн-силы на м²}.\\n\\\\]\\n\\nДля днища площадью 200 м² это уже около 2000 тонн подъёмной силы.\\n\\nПоэтому необходимы:\\n\\n- массивная силовая плита;\\n- достаточный собственный вес;\\n- анкерные сваи или грунтовые анкеры;\\n- в некоторых условиях — дренаж и снижение давления;\\n- проверка не только всплытия, но и гидравлического прорыва грунта под днищем.\\n\\nСП 248 прямо требует проверять всплытие, восходящую фильтрацию, суффозию и эрозию; в качестве мер против всплытия предусматриваются увеличение веса, снижение давления под днищем и анкеровка конструкции. citeturn559553view1\\n\\n## Гидроизоляция должна быть ремонтопригодной изнутри\\n\\nПосле погружения добраться до наружной поверхности стен практически невозможно. Поэтому обычная схема «наклеим мембрану снаружи и закопаем» здесь недостаточна.\\n\\nРациональна двойная конструкция:\\n\\n1. **Наружная силовая оболочка** из водонепроницаемого железобетона.\\n2. Все рабочие швы — с гидрошпонками и инъекционными шлангами.\\n3. Внутри — дренируемый технический зазор.\\n4. Затем независимая внутренняя «сухая» оболочка.\\n5. Внизу — доступные сборные приямки и резервные насосы.\\n\\nТогда локальную протечку можно обнаружить, локализовать и отремонтировать из помещения. Действующие правила допускают сочетание гидроизоляционных материалов, водонепроницаемого бетона и дренажных систем и требуют ремонтопригодности водозащиты на протяжении срока эксплуатации. citeturn559553view1\\n\\n## Какие грунты создадут проблемы\\n\\nОсобенно опасны:\\n\\n- валуны и строительный мусор;\\n- наклонные твёрдые прослойки;\\n- чередование мягких и плотных грунтов;\\n- плывуны;\\n- карстовые пустоты;\\n- оползневые участки;\\n- напорные водоносные горизонты.\\n\\nОдна сторона ножа может попасть на плотную прослойку, а противоположная продолжит опускаться — возникает крен. Поэтому до проектирования нужны скважины внутри пятна сооружения, лабораторные испытания грунтов и прогноз максимального уровня подземных вод. Специальные рекомендации прямо связывают возможность применения опускного колодца с результатами инженерно-геологических изысканий и не допускают такую технологию на геологически неустойчивых площадках без специальных защитных мероприятий. citeturn564081view3\\n\\n## Какую схему я бы выбрал для подземного дома\\n\\nНаиболее цельная концепция:\\n\\n- наружный железобетонный цилиндр или восьмигранник;\\n- нижняя техническая рабочая камера с режущим ножом;\\n- этажи строятся последовательно на поверхности и опускаются вместе с оболочкой;\\n- во всех перекрытиях остаётся общий центральный технологический проём;\\n- грунт удаляется грейфером, небольшим экскаватором, шнеком либо гидромеханическим способом;\\n- погружение контролируется независимыми домкратами;\\n- после достижения глубины устраивается противофильтрационная бетонная пробка и силовое днище;\\n- центральный проём превращается в атриум, лестнично-лифтовое ядро и магистраль коммуникаций;\\n- наружная оболочка остаётся «грязной» силовой конструкцией, внутри неё строится ремонтопригодная сухая оболочка;\\n- наземная часть возводится только после завершения погружения.\\n\\nДля свободного участка в Базарном Карбулаке обычный котлован с откосами, вероятнее всего, окажется дешевле. Но **опускная подземная башня** становится особенно интересной, когда нужны несколько глубоких этажей, минимальное пятно стройки, серийное строительство одинаковых модулей или возможность почти всю тяжёлую работу выполнять на уровне земли.\\n\\nТо есть сама идея сильная. Её наиболее жизнеспособная форма — **не дом на погружающемся фундаменте, а единая управляемо опускаемая железобетонная оболочка, внутри которой этажи являются частью конструкции и последовательно строятся на поверхности**.\",{\"_677\":678},{\"_200\":3642,\"_207\":4230,\"_46\":3645,\"_210\":4231,\"_212\":213,\"_214\":26,\"_215\":216,\"_217\":4232,\"_219\":220},\"cbed2af0-7b29-48a9-bf85-c776442768a9\",[3626],{\"_674\":675,\"_217\":4236},{\"_669\":692,\"_210\":4235},{\"_685\":686,\"_687\":4233,\"_240\":3655,\"_242\":3655,\"_689\":4234,\"_691\":3645,\"_259\":10,\"_252\":14},647,1786700376.758367,\"Обработка заняла 10m 47s\",{},{\"_200\":42
